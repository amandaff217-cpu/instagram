<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; color: #262626; padding-bottom: 60px; }

/* Header */
.header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #dbdbdb; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
.logo { font-family: 'Billabong', 'Grand Hotel', cursive; font-size: 28px; font-weight: 400; }
.header-icons { display: flex; gap: 18px; font-size: 22px; }
.header-icons span { cursor: pointer; }

/* Bottom Nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #dbdbdb; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
.bottom-nav div { font-size: 24px; cursor: pointer; padding: 4px 12px; }

/* Stories */
.stories-bar { background: #fff; border: 1px solid #dbdbdb; border-radius: 8px; margin: 12px; padding: 12px; display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; }
.stories-bar::-webkit-scrollbar { display: none; }
.story-item { display: flex; flex-direction: column; align-items: center; min-width: 66px; cursor: pointer; }
.story-ring { width: 66px; height: 66px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
.story-ring.viewed { background: #dbdbdb; }
.story-ring.own { background: #dbdbdb; position: relative; }
.story-avatar { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid #fff; object-fit: cover; background: #efefef; }
.story-plus { position: absolute; bottom: 0; right: 0; background: #0095f6; color: #fff; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
.story-name { font-size: 12px; margin-top: 4px; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Post */
.post { background: #fff; border: 1px solid #dbdbdb; margin-bottom: 12px; }
.post-head { display: flex; align-items: center; padding: 12px 14px; gap: 10px; }
.post-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer; }
.post-user { flex: 1; font-size: 14px; font-weight: 600; cursor: pointer; }
.post-user .verified { color: #0095f6; font-size: 12px; margin-left: 2px; }
.post-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #efefef; }
.post-actions { display: flex; padding: 8px 12px; font-size: 24px; }
.post-actions .right { margin-left: auto; }
.post-actions span { cursor: pointer; padding: 4px; }
.post-likes { padding: 0 14px; font-weight: 600; font-size: 14px; }
.post-caption { padding: 6px 14px; font-size: 14px; line-height: 1.4; }
.post-caption b { font-weight: 600; margin-right: 5px; cursor: pointer; }
.post-comments-link { padding: 4px 14px; color: #8e8e8e; font-size: 14px; cursor: pointer; }
.post-time { padding: 4px 14px 12px; font-size: 10px; color: #8e8e8e; text-transform: uppercase; letter-spacing: 0.2px; }
.post-add-comment { border-top: 1px solid #efefef; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.post-add-comment input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; }
.post-add-comment button { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; opacity: 0.4; font-size: 14px; }
.post-add-comment button.active { opacity: 1; }

/* Explore Grid */
.explore-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.explore-item { aspect-ratio: 1; position: relative; cursor: pointer; overflow: hidden; background: #efefef; }
.explore-item img { width: 100%; height: 100%; object-fit: cover; }
.explore-item.multi::after { content: '⎘'; position: absolute; top: 8px; right: 8px; color: #fff; font-size: 18px; text-shadow: 0 0 4px rgba(0,0,0,0.5); }

/* Profile */
.profile-top { background: #fff; padding: 20px 16px; border-bottom: 1px solid #dbdbdb; }
.profile-main { display: flex; align-items: center; gap: 28px; margin-bottom: 16px; }
.profile-pic { width: 86px; height: 86px; border-radius: 50%; object-fit: cover; border: 1px solid #dbdbdb; cursor: pointer; }
.profile-stats { display: flex; flex: 1; justify-content: space-around; }
.profile-stat { text-align: center; cursor: pointer; }
.profile-stat b { display: block; font-size: 18px; font-weight: 600; }
.profile-stat span { font-size: 14px; }
.profile-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.profile-bio { font-size: 14px; line-height: 1.4; white-space: pre-line; }
.profile-category { color: #8e8e8e; font-size: 14px; margin-bottom: 6px; }
.profile-links a { color: #00376b; font-size: 14px; font-weight: 600; text-decoration: none; }
.profile-buttons { display: flex; gap: 6px; margin-top: 16px; }
.btn { flex: 1; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; background: #efefef; color: #262626; }
.btn.primary { background: #0095f6; color: #fff; }
.btn.following { background: #efefef; }
.profile-tabs { display: flex; border-top: 1px solid #dbdbdb; background: #fff; }
.profile-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-size: 22px; color: #8e8e8e; border-top: 1px solid transparent; margin-top: -1px; }
.profile-tab.active { color: #262626; border-top-color: #262626; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.modal-box { background: #fff; border-radius: 12px; width: 90%; max-width: 400px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-head { padding: 12px; text-align: center; font-weight: 600; border-bottom: 1px solid #dbdbdb; position: relative; }
.modal-close { position: absolute; right: 12px; top: 8px; font-size: 22px; cursor: pointer; background: none; border: none; }
.modal-list { overflow-y: auto; flex: 1; }
.modal-user { display: flex; align-items: center; padding: 10px 14px; gap: 12px; cursor: pointer; }
.modal-user:hover { background: #fafafa; }
.modal-user img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.modal-user-info { flex: 1; overflow: hidden; }
.modal-user-name { font-weight: 600; font-size: 14px; }
.modal-user-full { color: #8e8e8e; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-follow-btn { padding: 6px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: none; background: #0095f6; color: #fff; }
.modal-follow-btn.following { background: #efefef; color: #262626; }

/* Story Viewer */
.story-viewer { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; }
.story-viewer.show { display: flex; align-items: center; justify-content: center; }
.story-content { width: 100%; max-width: 420px; height: 100vh; position: relative; background: #000; }
.story-content img { width: 100%; height: 100%; object-fit: cover; }
.story-progress { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 4px; }
.story-progress-bar { flex: 1; height: 2px; background: rgba(255,255,255,0.4); border-radius: 2px; overflow: hidden; }
.story-progress-fill { height: 100%; background: #fff; width: 0%; }
.story-user-head { position: absolute; top: 24px; left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; color: #fff; }
.story-user-head img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.story-user-head .name { font-weight: 600; font-size: 14px; }
.story-user-head .time { font-size: 12px; opacity: 0.8; margin-left: 6px; }
.story-close { position: absolute; top: 24px; right: 12px; color: #fff; font-size: 28px; cursor: pointer; background: none; border: none; z-index: 10; }
.story-nav { position: absolute; top: 0; bottom: 0; width: 40%; cursor: pointer; }
.story-nav.left { left: 0; }
.story-nav.right { right: 0; }

/* Chat */
.chat-screen { display: none; position: fixed; inset: 0; background: #fff; z-index: 1500; flex-direction: column; }
.chat-screen.show { display: flex; }
.chat-head { padding: 12px 16px; border-bottom: 1px solid #dbdbdb; display: flex; align-items: center; gap: 12px; }
.chat-head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.chat-head-info { flex: 1; }
.chat-head-name { font-weight: 600; font-size: 15px; }
.chat-head-status { font-size: 12px; color: #8e8e8e; }
.chat-back { font-size: 24px; cursor: pointer; background: none; border: none; }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 70%; padding: 10px 14px; border-radius: 22px; font-size: 14px; line-height: 1.35; word-wrap: break-word; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.received { background: #efefef; color: #262626; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.sent { background: #3797f0; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg img { max-width: 100%; border-radius: 16px; margin-top: 4px; display: block; }
.typing { display: flex; gap: 3px; padding: 12px 14px; background: #efefef; border-radius: 22px; align-self: flex-start; width: fit-content; }
.typing span { width: 7px; height: 7px; background: #8e8e8e; border-radius: 50%; animation: bounce 1.4s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
.chat-input { padding: 10px 14px; border-top: 1px solid #dbdbdb; display: flex; gap: 10px; align-items: center; }
.chat-input input { flex: 1; border: 1px solid #dbdbdb; border-radius: 22px; padding: 9px 14px; outline: none; font-size: 14px; }
.chat-input button { background: none; border: none; color: #0095f6; font-weight: 600; cursor: pointer; font-size: 14px; }

/* Suggested */
.suggested { background: #fff; border: 1px solid #dbdbdb; margin: 12px 0; padding: 14px; }
.suggested-head { display: flex; justify-content: space-between; margin-bottom: 12px; color: #8e8e8e; font-size: 14px; font-weight: 600; }
.suggested-user { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.suggested-user img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; cursor: pointer; }
.suggested-user-info { flex: 1; overflow: hidden; }
.suggested-user-name { font-weight: 600; font-size: 14px; cursor: pointer; }
.suggested-user-sub { color: #8e8e8e; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggested-follow { background: none; border: none; color: #0095f6; font-weight: 600; font-size: 13px; cursor: pointer; }

/* Search */
.search-bar { padding: 10px 14px; background: #fff; border-bottom: 1px solid #dbdbdb; position: sticky; top: 52px; z-index: 50; }
.search-bar input { width: 100%; background: #efefef; border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; outline: none; }

/* Fame */
.fame-badge { position: fixed; top: 60px; right: 12px; background: #fff; border: 1px solid #dbdbdb; border-radius: 10px; padding: 8px 12px; font-size: 12px; z-index: 90; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.fame-badge b { color: #ed4956; }

.hidden { display: none !important; }
</style>
</head>
<body>

<header class="header">
    <div class="logo">Instagram</div>
    <div class="header-icons">
        <span onclick="showNotif()">♡</span>
        <span onclick="showScreen('chat-list')">✈</span>
    </div>
</header>

<div class="fame-badge">⭐ Fama: <b id="fameCount">0</b></div>

<div id="screen-feed"></div>
<div id="screen-explore" class="hidden"></div>
<div id="screen-profile" class="hidden"></div>
<div id="screen-user-profile" class="hidden"></div>
<div id="screen-chat-list" class="hidden"></div>

<!-- Story Viewer -->
<div class="story-viewer" id="storyViewer">
    <div class="story-content">
        <div class="story-progress" id="storyProgress"></div>
        <div class="story-user-head">
            <img id="storyViewerAvatar" src="">
            <span class="name" id="storyViewerName"></span>
            <span class="time" id="storyViewerTime">2h</span>
            <button class="story-close" onclick="closeStory()">✕</button>
        </div>
        <img id="storyViewerImg" src="">
        <div class="story-nav left" onclick="prevStory()"></div>
        <div class="story-nav right" onclick="nextStory()"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-head">
            <span id="modalTitle">Seguidores</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-list" id="modalList"></div>
    </div>
</div>

<!-- Chat Screen -->
<div class="chat-screen" id="chatScreen">
    <div class="chat-head">
        <button class="chat-back" onclick="closeChat()">‹</button>
        <img id="chatAvatar" src="">
        <div class="chat-head-info">
            <div class="chat-head-name" id="chatName"></div>
            <div class="chat-head-status" id="chatStatus">Ativo agora</div>
        </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Mensagem..." onkeypress="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()">Enviar</button>
    </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <div onclick="showScreen('feed')">🏠</div>
    <div onclick="showScreen('explore')">🔍</div>
    <div onclick="showScreen('feed')">⊕</div>
    <div onclick="showNotif()">♡</div>
    <div onclick="showScreen('profile')">👤</div>
</div>

// ============ DATABASE ============

// Generate users - 60% male, 40% female, mostly Asian
const users = [];
const numUsers = 60;
for (let i = 0; i < numUsers; i++) {
    const isMale = Math.random() < 0.6;
    const names = isMale ? maleNames : femaleNames;

function toggleFollow(id, btn) {
    const u = getUser(id);
    u.isFollowing = !u.isFollowing;
    if (u.isFollowing) {
        u.followers++;
        me.following++;
        me.fame += 5;
        if (btn) {
            btn.textContent = 'Seguindo';
            if (btn.classList.contains('suggested-follow')) {
                btn.style.color = '#262626';
            } else {
                btn.classList.remove('primary');
                btn.classList.add('following');
            }
        }
        // Auto welcome message
        setTimeout(() => {
            const greetings = {
                romantic: ['Oi! Que bom te ver por aqui 😊', 'Olá! Tudo bem?'],
                fitness: ['E aí! Bora treinar? 💪', 'Fala! Como tá?'],
                artistic: ['Oi! Alma criativa por aqui 🎨', 'Olá! Tudo inspirado?'],
                professional: ['Olá! Como vão os negócios?', 'Oi! Trabalhando muito?'],
                funny: ['E aí! Chegou a boa vibe 😄', 'Oi! Finalmente alguém interessante!']
            };
            const msgs = greetings[u.personality];
            u.messages.push({ text: msgs[Math.floor(Math.random() * msgs.length)], from: 'them', time: Date.now() });
        }, 500);
    } else {
        u.followers--;
        me.following--;
        if (btn) {
            btn.textContent = 'Seguir';
            if (btn.classList.contains('suggested-follow')) {
                btn.style.color = '#0095f6';
            } else {
                btn.classList.add('primary');
                btn.classList.remove('following');
            }
        }
    }
    document.getElementById('fameCount').textContent = me.fame;
}

function likePost(id) {
    const p = posts.find(x => x.id === id);
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    document.getElementById('like-' + id).textContent = p.liked ? '❤️' : '♡';
    document.getElementById('likes-' + id).textContent = fmt(p.likes) + ' curtidas';
    if (p.liked) me.fame += 1;
    document.getElementById('fameCount').textContent = me.fame;
}

// ============ STORIES ============
function openStory(userId) {
    currentStoryUser = userId;
    currentStoryIndex = 0;
    document.getElementById('storyViewer').classList.add('show');
    renderStory();
}

function renderStory() {
    const u = getUser(currentStoryUser);
    const s = u.stories[currentStoryIndex];
    document.getElementById('storyViewerAvatar').src = u.avatar;
    document.getElementById('storyViewerName').textContent = u.username;
    document.getElementById('storyViewerTime').textContent = s.time;
    document.getElementById('storyViewerImg').src = s.img;
    
    let progressHTML = '';
    u.stories.forEach((_, i) => {
        progressHTML += `<div class="story-progress-bar"><div class="story-progress-fill" id="storyFill-${i}" style="width:${i < currentStoryIndex ? '100' : '0'}%"></div></div>`;
    });
    document.getElementById('storyProgress').innerHTML = progressHTML;
    
    clearInterval(storyTimer);
    let progress = 0;
    storyTimer = setInterval(() => {
        progress += 2;
        const fill = document.getElementById('storyFill-' + currentStoryIndex);
        if (fill) fill.style.width = progress + '%';
        if (progress >= 100) nextStory();
    }, 100);
}

function nextStory() {
    const u = getUser(currentStoryUser);
    if (currentStoryIndex < u.stories.length - 1) {
        currentStoryIndex++;
        renderStory();
    } else {
        const idx = users.findIndex(x => x.id === currentStoryUser);
        let nextIdx = idx + 1;
        while (nextIdx < users.length && users[nextIdx].stories.length === 0) nextIdx++;
        if (nextIdx < users.length) {
            currentStoryUser = users[nextIdx].id;
            currentStoryIndex = 0;
            renderStory();
        } else {
            closeStory();
        }
    }
}

function prevStory() {
    if (currentStoryIndex > 0) {
        currentStoryIndex--;
        renderStory();
    }
}

function closeStory() {
    clearInterval(storyTimer);
    document.getElementById('storyViewer').classList.remove('show');
}

function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !currentChatUser) return;
    const u = getUser(currentChatUser);
    u.messages.push({ text, from: 'me', time: Date.now() });
    u.relationship = Math.min(100, u.relationship + 3);
    me.fame += 2;
    document.getElementById('fameCount').textContent = me.fame;
    input.value = '';
    renderMessages();
    
    // Typing
    setTimeout(() => {
        const container = document.getElementById('chatMessages');
        container.innerHTML += `<div class="typing" id="typing-ind"><span></span><span></span><span></span></div>`;
        container.scrollTop = container.scrollHeight;
        
        const delay = 1500 + Math.random() * 2000;
        setTimeout(() => {
            document.getElementById('typing-ind')?.remove();
            const response = generateResponse(u);
            u.messages.push(response);
            u.relationship = Math.min(100, u.relationship + 2);
            renderMessages();
        }, delay);
    }, 500);
}

            low: ['Olá! Como vão os negócios?', 'Oi! Trabalhando muito?', 'Hey! Sucesso hoje?'],
            mid: ['Você é muito dedicado!', 'Admiro sua ambição 🚀', 'Você vai longe!'],
            high: ['O sucesso vem pra quem trabalha!', 'Vamos fazer história 💼', 'Parceria de respeito!'],
            photos: ['https://images.unsplash.com/photo-1560250097-0b93528c311a?w=400', 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400']
        },
        funny: {
            low: ['E aí! Chegou a boa vibe 😄', 'Oi! Finalmente alguém interessante!', 'Fala, sumido(a)!'],
            mid: ['Hahaha você é demais!', 'Adorei sua energia 😂', 'Você me faz rir!'],
            high: ['Você é minha pessoa favorita!', 'Rindo alto aqui 😆', 'Melhor conversa do dia!'],
            photos: ['https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400', 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400']
        }
    };
    
    const data = responses[p];
    let level;
    if (rel < 20) level = 'low';
    else if (rel < 60) level = 'mid';
    else level = 'high';
    
    const text = data[level][Math.floor(Math.random() * data[level].length)];
    const sendPhoto = rel > 30 && Math.random() < 0.35;
    
    return {
        text,
        from: 'them',
        time: Date.now(),
        img: sendPhoto ? data.photos[Math.floor(Math.random() * data.photos.length)] : null
    };
}

function viewFullPhoto(url) {
    document.getElementById('modalTitle').textContent = 'Foto';
    document.getElementById('modalList').innerHTML = `<img src="${url}" style="width:100%;display:block">`;
    document.getElementById('modal').classList.add('show');
}

function showNotif() {
    document.getElementById('modalTitle').textContent = 'Notificações';
    let html = '';
    users.slice(0, 10).forEach(u => {
        const actions = ['curtiu sua foto', 'começou a seguir você', 'comentou: "Lindo!"', 'mencionou você'];
        const action = actions[Math.floor(Math.random() * actions.length)];
        html += `<div class="modal-user" onclick="closeModal();openUserProfile(${u.id})">
            <img src="${u.avatar}">
            <div class="modal-user-info">
                <div class="modal-user-name">${u.username}</div>
                <div class="modal-user-full">${action} • ${Math.floor(Math.random()*23)+1}h</div>
            </div>
        </div>`;
    });
    document.getElementById('modalList').innerHTML = html;
    document.getElementById('modal').classList.add('show');
}

// Init
document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
showScreen('feed');
